name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres service matching docker-compose.yml (postgres:16, app/app/app).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Non-secret, CI-only values for the ephemeral Postgres service — NOT
      # production secrets and NOT a real .env.
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: app                  # lets admin `psql -U app` auth over TCP
      PSQL: psql                       # override the Makefile's docker-exec default
      ADMIN_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
      RLS_DB_PASSWORD: uaid_app        # CI-only runtime role password (ephemeral)

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (+ Python 3.11)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck owned Slice 55/56/57/58/59/60/61a paths
        run: uv run pyright app/ops app/models/ops_signal.py app/models/ops_incident.py app/models/ops_hotfix.py app/models/ops_stabilization.py app/models/pm_issue_mapping.py app/repositories/ops_signals.py app/repositories/ops_incidents.py app/repositories/ops_incident_reads.py app/repositories/ops_hotfix.py app/repositories/ops_stabilization.py app/repositories/ops_stabilization_reads.py app/repositories/autonomy_policies.py tests/test_ops_signals.py tests/test_ops_signals_db.py tests/test_ops_signals_checks.py tests/test_ops_signals_migrate.py tests/ops_signals_support.py tests/test_ops_incidents.py tests/test_ops_incidents_db.py tests/test_ops_incidents_catalog.py tests/test_ops_incidents_checks.py tests/test_ops_incidents_migrate.py tests/ops_incidents_support.py tests/test_ops_hotfix.py tests/test_ops_hotfix_db.py tests/test_ops_hotfix_checks.py tests/test_ops_hotfix_migrate.py tests/test_ops_hotfix_currentness.py tests/ops_hotfix_support.py tests/test_ops_stabilization.py tests/test_ops_stabilization_db.py tests/test_ops_stabilization_checks.py tests/test_ops_stabilization_migrate.py tests/test_ops_stabilization_guards.py tests/ops_stabilization_support.py app/runtime/control_loop.py app/runtime/checkpointer.py app/repositories/go_live_decisions.py app/release/go_live_decision.py tests/test_control_loop_owner_retry.py tests/test_control_loop_owner_review.py app/release/export_bundle.py app/release/export_signing.py app/release/export_bundle_db_checks.py app/release/export_bundle_ddl.py app/release/export_bundle_service.py app/models/evidence_pack_export.py app/repositories/export_bundles.py app/repositories/export_bundle_reads.py tests/test_export_bundle.py tests/test_export_bundle_db.py tests/test_export_bundle_checks.py tests/test_export_bundle_migrate.py tests/test_export_bundle_guards.py tests/export_bundle_support.py app/ecosystem app/models/ecosystem_catalog.py app/repositories/catalog_admin.py app/repositories/catalog_reads.py app/repositories/catalog_adoptions.py tests/ecosystem_catalog_support.py tests/test_ecosystem_catalog.py tests/test_ecosystem_catalog_db.py tests/test_ecosystem_catalog_guards.py tests/test_ecosystem_catalog_checks.py tests/test_ecosystem_catalog_migrate.py tests/test_ecosystem_catalog_races.py

      - name: Docker-free tests
        run: make test

      - name: Ensure psql client is available
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: DB-backed tests (RLS, against Postgres service)
        run: make test-db RLS_DB_PASSWORD=uaid_app
